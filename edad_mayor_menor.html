<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de edad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .container {
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <h1>Verificador de edad</h1>

  <div class="container">
    <label for="campoEdad">Ingresa tu edad:</label>
    <input type="number" id="campoEdad" placeholder="Ej. 18" min="0">
    <button id="btnVerificar">Verificar</button>
  </div>

  <!-- Enlace al archivo JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
